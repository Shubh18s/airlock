# Mounted read-only at ~/.tmux.conf. At the repository root, not under claude/, because a
# multiplexer is not a harness setting.
#
# tmux reads /etc/tmux.conf first, so the image's minimal config applies underneath and
# this layers on top. That ordering is what lets you move the prefix for your own sessions
# without the image moving it for everyone.
#
# There is no clipboard utility in the image and no display server socket, so OSC 52 is the
# only route to the host clipboard. It needs the attached terminal to support it.
set -g set-clipboard on
bind -T copy-mode-vi y send -X copy-selection-and-cancel

