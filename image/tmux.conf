# Minimal tmux configuration for agent sessions.
#
# Everything here is justified by being in a container rather than by taste. No prefix
# rebinding, no keybindings, no colours. Silently moving someone's prefix key in a tool
# they installed for security reasons would be rude.
#
# Installed to /etc/tmux.conf, which tmux reads BEFORE ~/.tmux.conf. It lives in /etc
# rather than the home directory for two reasons. The home volume is seeded from the
# image only once, so a config placed there would never reach volumes that already
# exist. And /etc is an image layer, so `agent -Build` picks up changes immediately.
#
# To layer your own config on top, write it to ~/.tmux.conf inside a session. It persists
# in that project's home volume and overrides everything below.

# Agent output is long. The 2000-line default loses the start of a run, which is usually
# the part explaining what it decided to do and why.
set -g history-limit 100000

# There is no host terminal scrollback to fall back on inside a container, so the mouse
# is the only practical way to read back through a long run.
set -g mouse on

# Without this, diffs and syntax highlighting degrade to 8 colours. tmux-256color is
# present in this image at /lib/terminfo/t/tmux-256color.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# OSC 52 hands the selection to your terminal emulator over the escape stream. No pbcopy,
# xclip or wl-copy exists in this image, and there is no X11 or Wayland socket to talk to,
# so this is the only route from a container to the host clipboard.
set -g set-clipboard on

# Zero escape-time. The default 500ms delay makes agent TUIs feel broken and swallows ESC
# keypresses inside Claude Code and similar tools.
set -sg escape-time 0
